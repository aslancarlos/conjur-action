name: conjur-action

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  authn-jwt:
    runs-on: self-hosted
    environment: dev

    permissions:
      # kics-scan ignore-line
      id-token: 'write'
      contents: 'read'

    steps:
      - uses: actions/checkout@v1
      - name: Use CyberArk Conjur Secret Fetcher Action w/ GitHub JWT
        uses: ./
        with:
          url: ${{ secrets.CONJUR_URL }}
          account: conjur
          authn_id: ${{ secrets.CONJUR_SERVICE_ID }}
          secrets: data/vault/dev-demo-aslan/asramos_pcloud_pov/username|sql_username;data/vault/dev-demo-aslan/asramos_pcloud_pov/password|sql_password
      - name: Check SQL_USERNAME Outside Docker Container for Secret Masking
        run: printenv SQL_USERNAME | sed 's/./& /g'
      - name: Check SQL_PASSWORD Outside Docker Container for Secret Masking
        run: printenv SQL_PASSWORD | sed 's/./& /g'
      - name: Clean Workspace
        uses: AutoModality/action-clean@v1.1.0

  check-aws-ec2:
    runs-on: self-hosted
    environment: dev
    needs: authn-jwt

    permissions:
      # kics-scan ignore-line
      id-token: 'write'
      contents: 'read'

    steps:
      - uses: actions/checkout@v1
      - name: Retrieve AWS Credentials from Conjur
        uses: ./
        with:
          url: ${{ secrets.CONJUR_URL }}
          account: conjur
          authn_id: ${{ secrets.CONJUR_SERVICE_ID }}
          secrets: data/vault/dev-demo-aslan/asramos_pcloud_pov/AWSAccessKeyID|AWSACCESSKEYID;data/vault/dev-demo-aslan/asramos_pcloud_pov/password|AWSSECRETACCESSKEY
      - name: List Running EC2 Instances
        run: |
          export AWS_ACCESS_KEY_ID="$AWSACCESSKEYID"
          export AWS_SECRET_ACCESS_KEY="$AWSSECRETACCESSKEY"
          export AWS_DEFAULT_REGION="sa-east-1"
          aws ec2 describe-instances \
            --filters "Name=instance-state-name,Values=running" \
            --query 'Reservations[*].Instances[*].{ID:InstanceId,Type:InstanceType,State:State.Name,Name:Tags[?Key==`Name`]|[0].Value,IP:PrivateIpAddress}' \
            --output table
      - name: Clean Workspace
        uses: AutoModality/action-clean@v1.1.0

